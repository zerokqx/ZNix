[project]
name = "python-template"
version = "0.1.0"
description = "A Python project template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mobile-sam==1.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "timm>=1.0.0,<2",
    "torch==2.12.0+rocm7.2",
    "torchvision==0.27.0+rocm7.2",
]

[tool.uv.sources]
mobile-sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git", rev = "f706ad9c4eb7f219c00d9050e46328518ffb65d2" }
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
